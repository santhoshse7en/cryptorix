[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Cryptorix"
version = "2.0.0"
description = "A lightweight Python toolkit for AES, Fernet, JWE, hybrid RSA+AES encryption, format preserving encryption, Argon2id/scrypt/HKDF key derivation, AWS KMS, and AWS Secrets Manager."
authors = [
    { name = "M Santhosh Kumar", email = "santhoshse7en@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed"
]
readme = "README.md"
requires-python = ">=3.9"
keywords = [
    "AES", "FERNET", "JWE", "Hybrid Encryption", "KMS", "Secrets Manager",
    "Encryption", "Decryption", "AWS", "Security", "Cryptography",
    "Argon2", "Scrypt", "HKDF", "Key Derivation", "FPE", "Format Preserving Encryption",
    "Tokenization"
]
dependencies = [
    "cryptography>=45.0.7"
]

[project.optional-dependencies]
aws = ["boto3>=1.40.23"]
jwe = ["jwcrypto>=1.5.6"]
all = ["Cryptorix[aws,jwe]"]
dev = ["pytest>=8.0", "Cryptorix[all]"]

[project.urls]
Documentation = "https://github.com/santhoshse7en/cryptorix#readme"
Source = "https://github.com/santhoshse7en/cryptorix"
Tracker = "https://github.com/santhoshse7en/cryptorix/issues"

[tool.setuptools]
packages = ["Cryptorix"]
include-package-data = true

[tool.setuptools.package-data]
Cryptorix = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312", "py313", "py314"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
